<canvas id="c"></canvas>
<script>
// Wild Facts videos (octopus mascot). ?f=wf.json&s=<name> for Shorts (quiz | facts), ?f=wf_long.json&s=<name> for 16:9 12-question quizzes.
// Frame-exact export: canvas frames + OfflineAudioContext audio -> WebCodecs -> mp4-muxer.
const P=new URLSearchParams(location.search),FILE=P.get('f')||'wf.json',NAME=P.get('s'),LONG=FILE.includes('long');

function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function text(t,X,Y,size,color,weight=800,align='center'){x.font=`${weight} ${size}px ${F}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='middle';x.fillText(t,X,Y)}
function stroked(t,X,Y,size,color,w=900){x.font=`${w} ${size}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=size*.16;x.strokeStyle='rgba(30,10,40,.75)';x.lineJoin='round';x.strokeText(t,X,Y);x.fillStyle=color;x.fillText(t,X,Y)}
function fit(t,max,size,w=800){x.font=`${w} ${size}px ${F}`;while(x.measureText(t).width>max&&size>18){size-=2;x.font=`${w} ${size}px ${F}`}return size}
function wrap(t,max,size,w=800){x.font=`${w} ${size}px ${F}`;const ws=t.split(' '),L=[];let cur='';for(const s of ws){const tr=cur?cur+' '+s:s;if(x.measureText(tr).width>max&&cur){L.push(cur);cur=s}else cur=tr}L.push(cur);return L}

  for(const q of sq){x.save();x.translate(q.x*W,((q.y*H-t*q.v)%(H+200)+H+200)%(H+200)-100);x.rotate(q.r+t*.12);x.fillStyle=`rgba(255,255,255,${q.o})`;if(q.c){x.beginPath();x.arc(0,0,q.z/2,0,7);x.fill()}else{rr(-q.z/2,-q.z/2,q.z,q.z,10);x.fill()}x.restore()}}
// octopus mascot: round head, big eyes, beaded tentacles; wave=1 raises one arm
function octo(X,Y,s,t,wave=0){x.save();x.translate(X,Y+Math.sin(t*2.4)*8*s);x.scale(s,s);
  // 6 beaded tentacles from the bottom edge of the head, fanning out and curling outward at the tips (like the original mascot)
  for(let k=0;k<6;k++){const side=k-2.5;const bx=-46+k*18.4;let px=bx,py=60*Math.sqrt(Math.max(0,1-(bx/66)**2))-10;const up=wave&&k===5;let a=up?-.35:Math.PI/2-side*.15;
    for(let j=0;j<8;j++){const step=12-j*.5;if(up)a+=-.13+Math.sin(t*9+j*.4)*.05;else a-=side*.035-Math.sin(t*2.6+k*.9+j*.35)*.035;
      px+=Math.cos(a)*step;py+=Math.sin(a)*step;x.beginPath();x.arc(px,py,Math.max(4.5,10.5-j*.65),0,7);x.fillStyle='#ff7c61';x.fill()}}

  const bl=(t%3.7)<.12?.15:1;for(const ex of[-22,22]){x.save();x.translate(ex,6);x.scale(1,bl);x.beginPath();x.arc(0,0,15,0,7);x.fillStyle='#fff';x.fill();x.beginPath();x.arc(2,2,8,0,7);x.fillStyle='#1b1030';x.fill();x.beginPath();x.arc(5,-1,3,0,7);x.fillStyle='#fff';x.fill();x.restore()}
  x.beginPath();x.arc(0,26,9,.15*Math.PI,.85*Math.PI);x.lineWidth=4;x.strokeStyle='#8a1f12';x.stroke();x.restore()}
function label(t,X,Y,size,rot=-.05,k=1){x.save();x.translate(X,Y);x.rotate(rot);x.scale(k,k);x.font=`900 ${size}px ${F}`;const w=x.measureText(t).width+size*.9,h=size*1.55;x.shadowColor='rgba(0,0,0,.25)';x.shadowOffsetY=8;x.shadowBlur=14;rr(-w/2,-h/2,w,h,h*.28);x.fillStyle='#ffd23f';x.fill();x.shadowColor='transparent';text(t,0,size*.05,size,'#1d1340',900);x.restore()}
function badge(t,X,Y,size){x.font=`800 ${size}px ${F}`;const w=x.measureText(t).width+size*1.2,h=size*1.7;rr(X-w/2,Y-h/2,w,h,h/2);x.fillStyle='#ffd23f';x.fill();text(t,X,Y+1,size,'#1d1340',800)}
function cardBox(X,Y,w,h,k){x.save();x.translate(X,Y);const s=pop(k*3.5);x.scale(s,s);x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=30;x.shadowOffsetY=12;rr(-w/2,-h/2,w,h,34);x.fillStyle='#fff';x.fill();x.restore();return s}
function ring(left,total,X,Y,R){const u=left<=1;const sc=u?1+.06*Math.sin(left*Math.PI*8):1;x.save();x.translate(X,Y);x.scale(sc,sc);x.beginPath();x.arc(0,0,R,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=R*.16;x.strokeStyle=u?'#ef4444':left<=total/2?'#f59e0b':'#22c55e';
  x.beginPath();x.arc(0,0,R*.9,-Math.PI/2,-Math.PI/2+Math.PI*2*(left/total));x.stroke();text(String(Math.max(1,Math.ceil(left))),0,R*.06,R*1.0,'#1d1340',900);x.restore()}

// ---- timeline ----
// REEL (?reel=1): no title card; the first question is already on screen at frame 0 and the voice starts at once.
const REEL=new URLSearchParams(location.search).has('reel');
function plan(){INTRO=REEL?0:D.intro+.5;let t=INTRO;const read=C.read!==false,secs=C.secs||5,facts=C.kind==='facts';
  C.items.forEach((it,i)=>{const n=i+1;const g={i};const first=REEL&&i===0;
    if(facts){g.s=first?-1:t;g.say=first?.15:t+.5;g.e=g.say+D['f'+n]+.7;SEG.push(g);t=g.e;return}
    if(n===C.items.length&&C.items.length===5&&D.last){g.lastS=t;t+=D.last+.5}
    g.s=first?-1:t;g.q=first?.15:t+.35;let u=g.q+D['q'+n]+.25;g.o=[];
    if(read){for(let j=0;j<3;j++){g.o.push(u);u+=D[`o${n}_${j}`]+.18}}else{for(let j=0;j<3;j++)g.o.push(g.q+.25+j*.12)}
    g.cd=u+.1;g.rv=g.cd+secs;g.e=g.rv+Math.max(read?2.6:1.8,D['a'+n]+.6);g.secs=secs;SEG.push(g);t=g.e});
  ENDS=t;TOTAL=t+D.end+(LONG?9:2.2)}
// ---- drawing: quiz ----

    const hl=!rv&&C.read!==false&&t>=g.o[j]&&(j===2?t<g.cd:t<g.o[j+1]);x.save();x.translate(L.cx,Y);x.scale(p*(hl?1.04:1),p*(hl?1.04:1));
    x.globalAlpha=rv&&!ok?.45:1;x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=14;x.shadowOffsetY=6;rr(-L.ow/2,-L.oh/2,L.ow,L.oh,L.oh/2);x.fillStyle=rv&&ok?'#22c55e':hl?'#fff3c4':'#fff';x.fill();x.shadowColor='transparent';
    x.beginPath();x.arc(-L.ow/2+L.oh/2+6,0,L.oh*.34,0,7);x.fillStyle=LC[j];x.fill();text('ABC'[j],-L.ow/2+L.oh/2+6,2,L.oh*.36,'#fff',800);
    text(o,10,2,fit(o,L.ow-2*L.oh-20,L.ofs,700),rv&&ok?'#fff':'#1d1340',700);
    if(rv&&ok){const c=pop((t-g.rv)*4);x.save();x.translate(L.ow/2-L.oh/2-4,0);x.scale(c,c);x.beginPath();x.arc(0,0,L.oh*.32,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=L.oh*.09;x.strokeStyle='#22c55e';x.lineCap='round';x.beginPath();x.moveTo(-L.oh*.14,0);x.lineTo(-L.oh*.03,L.oh*.11);x.lineTo(L.oh*.16,-L.oh*.11);x.stroke();x.restore()}
    x.restore()});
  if(!rv){if(t>=g.cd)ring(g.rv-t,g.secs,L.ringX,L.ringY+(LONG?0:0),LONG?95:85)}
  else{const r=t-g.rv;confetti(r,L.cx,L.oy+it.a*L.og);const a=ease(r*3);x.globalAlpha=a;const fz=fit(it.f,LONG?640:960,LONG?44:56,900);
    if(LONG){const fl=wrap(it.f,620,54,900);fl.forEach((l,j)=>stroked(l,L.factX,L.factY-(fl.length-1)*36+j*72,54,'#ffd23f'))}else stroked(it.f,L.factX,L.factY,fz,'#fff');x.globalAlpha=1}
  if(LONG&&(t<g.cd||rv))octo(430,600,1.8,t,0)}
// ---- drawing: facts ----
function factsFrame(g,t){const it=C.items[g.i],n=g.i+1,k=t-g.s;const top=g.i===0?300:g.i===1?560:300;
  const bp=pop(k*3);x.save();x.translate(110,top-150);x.scale(bp,bp);rr(-46,-46,92,92,18);x.fillStyle='#ffd23f';x.fill();text(String(n),0,4,58,'#1d1340',900);x.restore();
  const lines=wrap(it.t,780,64);const ch=lines.length*80+80;const s=cardBox(W/2,top,880,ch,k-.1);if(s>.3)lines.forEach((l,j)=>text(l,W/2,top-(lines.length-1)*40+j*80+4,64,'#1d1340',800));
  const bk=pop((k-.6)*3);if(bk>0){x.save();x.translate(W/2,top+ch/2+150);x.scale(bk,bk);stroked(it.big,0,0,fit(it.big,900,150,900),'#ffd23f');x.restore();x.globalAlpha=cl((k-.9)*3);stroked(it.small,W/2,top+ch/2+270,fit(it.small,960,48,700),'#fff',700);x.globalAlpha=1}
  octo(g.i===1?820:240,top+ch/2+560,1.3,t,0);captions('f'+n,it.say,g.say,t)}
function captions(key,str,t0,t){const d=D[key];if(t<t0||t>t0+d+.2)return;const ws=str.split(' '),per=d/ws.length,i=Math.min(ws.length-1,Math.floor((t-t0)/per)),c0=Math.floor(i/3)*3;const chunk=ws.slice(c0,c0+3).join(' ').toUpperCase();stroked(chunk,W/2,1690,fit(chunk,960,82,900),'#fff')}
// ---- frame ----
function frame(t){bg(t);let cur=-1;for(let i=0;i<SEG.length;i++)if(t>=(SEG[i].lastS??SEG[i].s))cur=i;
  if(t<INTRO){const k=t;if(LONG){label(C.label,1250,430,110,-.04,pop(k*2.5));stroked(C.sub,1250,610,70,'#fff');octo(520,560,2.6,t,0)}
    else{label(C.label,W/2,560,96,-.05,pop(k*2.5));x.globalAlpha=cl((k-.4)*3);stroked(C.sub[0],W/2,740,64,'#fff');stroked(C.sub[1],W/2,830,64,'#ffd23f');x.globalAlpha=1;octo(W/2,1230,2.6,t,0)}
    if(!LONG&&C.kind==='facts')captions('intro',C.intro,.1,t);return}
  if(t<ENDS&&cur>=0){const g=SEG[cur];if(g.lastS!==undefined&&t<g.s){const k=t-g.lastS;x.save();x.translate(W/2,H/2);x.rotate(-.05);x.scale(pop(k*3),pop(k*3));rr(-330,-130,660,260,40);x.fillStyle='#ef4444';x.fill();text('LAST ONE',0,-30,96,'#fff',900);text('the hardest',0,62,52,'#ffe4e4',700);x.restore();return}
    if(C.kind==='facts')factsFrame(g,t);else{quizFrame(g,t);if(!LONG&&t<g.cd)octo(W-150,1640,.9,t,0)}return}
  const u=t-ENDS,N=C.items.length;
  if(C.kind==='facts'){const s=1+Math.sin(u*6)*.04;x.save();x.translate(W/2,560);x.scale(s*pop(u*3),s*pop(u*3));rr(-260,-85,520,170,40);x.fillStyle='#ef4444';x.fill();text('FOLLOW',0,4,96,'#fff',900);x.restore();stroked('A WILD FACT',W/2,760,80,'#fff');stroked('EVERY DAY',W/2,860,80,'#ffd23f');octo(W/2,1200,2.4,t,1);captions('end','Which one surprised you most? Follow for a wild fact every day!',.15+ENDS,t);return}
  const cx=LONG?1250:W/2,y0=LONG?260:560;stroked('HOW MANY',cx,y0,LONG?110:112,'#fff');stroked('DID YOU GET?',cx,y0+(LONG?125:125),LONG?110:112,'#ffd23f');
  const cols=['#ef4444','#f97316','#f59e0b','#3b82f6','#22c55e','#a855f7'];const marks=N===12?[0,3,6,9,12]:Array.from({length:N+1},(_,i)=>i);
  marks.forEach((m,i)=>{const X=cx+(i-(marks.length-1)/2)*(LONG?150:150),p=pop((u-.3-i*.1)*3);if(p<=0)return;x.save();x.translate(X,y0+(LONG?300:300));x.scale(p,p);x.beginPath();x.arc(0,0,58,0,7);x.fillStyle=cols[Math.round(i*(cols.length-1)/(marks.length-1))];x.fill();text(`${m}/${N}`,0,3,N>9?34:38,'#fff',800);x.restore()});
  text('Comment your score!',cx,y0+(LONG?440:450),LONG?52:56,'#fff',800);const s=1+Math.sin(u*6)*.04;x.save();x.translate(cx,y0+(LONG?580:620));x.scale(s,s);rr(-220,-70,440,140,36);x.fillStyle='#ef4444';x.fill();text('FOLLOW',0,4,76,'#fff',900);x.restore();
  octo(LONG?430:W/2,LONG?600:1500,LONG?2.2:1.9,t,1)}
// ---- sound ----
let ac,dest;const BUF={};const OUT=g=>g.connect(dest);
function tone(f,at,d,type='sine',v=.25,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);OUT(g);o.start(at);o.stop(at+d+.05)}

function say(n,at){if(!BUF[n])return;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=BUF[n];g.gain.value=1.25;s.connect(g);OUT(g);s.start(at)}
function schedule(){const beat=60/104;const bass=[110,110,147,131];for(let b=0;b*beat<TOTAL-.5;b++){const at=b*beat;tone(bass[Math.floor(b/4)%4]/2,at,.25,'sine',.1);if(b%2)noise(at,.04,.035,7000)}
  const mel=[523,659,784,659,587,698,880,698];for(let b=0;b*beat/2<TOTAL-.5;b++)tone(mel[b%8]/2,b*beat/2,.16,'triangle',.016);
  if(!REEL){noise(0,.5,.2,500);say('intro',.1)}if(C.kind==='facts'){SEG.forEach((g,i)=>{noise(Math.max(0,g.s),.3,.15,600);tone(880,Math.max(0,g.s+.05),.12,'triangle',.07,1300);say('f'+(i+1),g.say)})}
  else SEG.forEach((g,i)=>{const n=i+1;if(g.lastS!==undefined){tone(330,g.lastS,.3,'square',.06,220);say('last',g.lastS+.1)}noise(Math.max(0,g.s),.3,.15,600);say('q'+n,g.q);
    if(C.read!==false)g.o.forEach((ot,j)=>say(`o${n}_${j}`,ot));for(let k=0;k<g.secs;k++)tone(k===g.secs-1?1150:900,g.cd+k,.06,'square',.045);
    tone(988,g.rv,.12,'square',.08);tone(1319,g.rv+.08,.3,'square',.08);noise(g.rv,.3,.1,2000);say('a'+n,g.rv+.25)});
  [392,523,659,784,1047].forEach((f,i)=>tone(f,ENDS+i*.09,.3,'square',.045));say('end',ENDS+.15)}
async function fontsReady(){for(const w of[600,700,800,900])await document.fonts.load(`${w} 60px Poppins`)}
async function exportMp4(out){await fontsReady();const T0=0;
  const FPS=30,SR=48000,N=Math.ceil((TOTAL-T0)*FPS),A0=Math.round(T0*SR);ac=new OfflineAudioContext(2,Math.ceil((TOTAL+.2)*SR),SR);dest=ac.destination;
  for(const n of Object.keys(D))BUF[n]=await ac.decodeAudioData(await (await fetch(VOICE+n+'.wav')).arrayBuffer());schedule();const audio=await ac.startRendering();
  let pk=0;for(let c=0;c<2;c++){const d=audio.getChannelData(c);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]))}const gain=pk>.95?.95/pk:1;if(gain!==1)for(let c=0;c<2;c++){const d=audio.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=gain}
  const {Muxer,ArrayBufferTarget}=Mp4Muxer;const target=new ArrayBufferTarget();const mux=new Muxer({target,fastStart:'in-memory',video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:{codec:'aac',numberOfChannels:2,sampleRate:SR}});
  const ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{throw e}});ve.configure({codec:'avc1.640028',width:W,height:H,bitrate:LONG?8e6:10e6,framerate:FPS,latencyMode:'quality'});
  for(let f=0;f<N;f++){frame(T0+f/FPS);const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(vf,{keyFrame:f%60===0});vf.close();window.__prog=f/N;if(ve.encodeQueueSize>20)await new Promise(r=>ve.addEventListener('dequeue',r,{once:true}))}
