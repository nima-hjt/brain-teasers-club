<!doctype html><html><head><meta charset="utf-8"><title>Guess 20 Foods (long)</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&family=Noto+Color+Emoji&display=block">
<style>html,body{margin:0;background:#111}canvas{width:100%;display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Brain Teasers long video (16:9): "Guess 20 Movies by Emoji: Easy to Hard". Frame-exact export like the Shorts.
const VOICE='voice_foods/';
const ROUNDS=[
  {name:'EASY',items:[["🔥🐶", "HOT DOG", "HOT + DOG"], ["🥜🧈", "PEANUT BUTTER", "PEANUT + BUTTER"], ["🧀🍔", "CHEESEBURGER", "CHEESE + BURGER"], ["🍎🥧", "APPLE PIE", "APPLE + PIE"], ["🇫🇷🍞", "FRENCH TOAST", "FRENCH + TOAST"], ["🥚🥓", "BACON AND EGGS", "EGGS + BACON"], ["🍓🍦", "STRAWBERRY ICE CREAM", "STRAWBERRY + ICE CREAM"]]},
  {name:'MEDIUM',items:[["🐟🍟", "FISH AND CHIPS", "FISH + CHIPS"], ["🧀🍞🔥", "GRILLED CHEESE", "CHEESE + BREAD + HEAT"], ["🍰🧀", "CHEESECAKE", "CAKE + CHEESE"], ["🍌🍞", "BANANA BREAD", "BANANA + BREAD"], ["🍗🧇", "CHICKEN AND WAFFLES", "CHICKEN + WAFFLES"], ["🌽🐶", "CORN DOG", "CORN + DOG"], ["🥒🥪", "CUCUMBER SANDWICH", "CUCUMBER + SANDWICH"]]},
  {name:'HARD',items:[["🏄🌱", "SURF AND TURF", "SURF + TURF · seafood and steak"], ["⬛🌲🍰", "BLACK FOREST CAKE", "BLACK + FOREST + CAKE"], ["😈🍰", "DEVIL'S FOOD CAKE", "DEVIL + FOOD CAKE"], ["🥚🧻", "EGG ROLL", "EGG + ROLL"], ["🍞🍮", "BREAD PUDDING", "BREAD + PUDDING"], ["🥔🔨", "MASHED POTATOES", "POTATOES + MASH"]]}
];
const ALL=ROUNDS.flatMap((r,ri)=>r.items.map(([q,a,w])=>({q,a,w,round:ri})));
const W=1920,H=1080,COUNT=5,F='"Poppins",sans-serif',E='"Noto Color Emoji"';
let D={},TOTAL=0,INTRO=0,ENDT=0;const SEG=[],RSEG=[];
function plan(){INTRO=D.intro+.5;let t=INTRO,n=0;ROUNDS.forEach((r,ri)=>{const rs=t;t+=Math.max(3,D['r'+(ri+1)]+.6);RSEG.push({s:rs,e:t,ri});
  r.items.forEach(()=>{n++;const ans=D['a'+n];const s=t,cd=s+.6,rv=cd+COUNT,e=rv+Math.max(2.2,ans+.8);SEG.push({s,cd,rv,e,i:n-1});t=e})});
  ENDT=t;TOTAL=t+D.end+.8+D.plug+.8}
const cv=document.getElementById('c');let x=cv.getContext('2d');
const cl=v=>Math.max(0,Math.min(1,v)),ease=t=>1-Math.pow(1-cl(t),3);
const pop=t=>{t=cl(t);return t<1?ease(t)*(1+.18*Math.sin(t*Math.PI)):1};
let s0=11;const rnd=()=>(s0=(s0*16807)%2147483647)/2147483647;
const sq=Array.from({length:26},()=>({x:rnd()*W,y:rnd()*H,z:50+rnd()*110,r:rnd()*6,v:6+rnd()*14,o:.05+rnd()*.07}));
const conf=Array.from({length:80},()=>({a:rnd()*Math.PI*2,v:500+rnd()*900,c:['#ffc93c','#22c55e','#ff4d6d','#3b9cff','#a855f7','#fff'][Math.floor(rnd()*6)],s:12+rnd()*16,r:rnd()*6}));
const HUES=[['#141a4a','#2d6fb3'],['#1b1446','#5b3fb8'],['#3a1010','#c2552d']];
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function text(t,X,Y,size,color,weight=800,font=F,align='center'){x.font=`${weight} ${size}px ${font}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='middle';x.fillText(t,X,Y)}
function stroked(t,X,Y,size,color){x.font=`900 ${size}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=size*.14;x.strokeStyle='rgba(0,0,0,.55)';x.lineJoin='round';x.strokeText(t,X,Y);x.fillStyle=color;x.fillText(t,X,Y)}
function fit(t,max,size){x.font=`900 ${size}px ${F}`;while(x.measureText(t).width>max&&size>30){size-=4;x.font=`900 ${size}px ${F}`}return size}
function pillAt(label,X,Y,bgc,fg,size=44,padX=40){x.font=`900 ${size}px ${F}`;const w=x.measureText(label).width+padX*2,h=size*1.75;rr(X-w/2,Y-h/2,w,h,h/2);x.fillStyle=bgc;x.fill();text(label,X,Y+2,size,fg,900)}
function bg(t,r){const [a,b]=HUES[Math.max(0,r)%3];const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const q of sq){x.save();x.translate(q.x,(q.y-t*q.v+H*2)%(H+240)-120);x.rotate(q.r+t*.12);x.fillStyle=`rgba(255,255,255,${q.o})`;rr(-q.z/2,-q.z/2,q.z,q.z,14);x.fill();x.restore()}
  text('BRAIN TEASERS',70,70,40,'#ffc93c',800,F,'left')}
function emojis(q,cx,cy,size,gap,k){const parts=[...new Intl.Segmenter().segment(q)].map(p=>p.segment);gap=Math.min(gap,1000/parts.length);size=Math.min(size,gap*.72);
  parts.forEach((e,i)=>{const p=k==null?1:pop((k-.15-i*.18)*3.4);if(p<=0)return;x.save();x.translate(cx+(i-(parts.length-1)/2)*gap,cy);x.scale(p,p);text(e,0,0,size,'#000',400,E);x.restore()})}
function ring(left){const X=1600,Y=500,R=125,urgent=left<=1;const sc=urgent?1+.05*Math.sin(left*Math.PI*8):1;x.save();x.translate(X,Y);x.scale(sc,sc);
  x.beginPath();x.arc(0,0,R,0,Math.PI*2);x.fillStyle=urgent?'#ffe4e4':'#fff';x.fill();x.lineWidth=22;x.strokeStyle=urgent?'#ff3b3b':'#22c55e';
  x.beginPath();x.arc(0,0,R-9,-Math.PI/2,-Math.PI/2+Math.PI*2*(left/COUNT));x.stroke();text(String(Math.max(1,Math.ceil(left))),0,5,130,'#1b1b3a',900);x.restore()}
function confetti(r,cx,cy){if(r>1.6)return;for(const p of conf){const X=cx+Math.cos(p.a)*p.v*r,Y=cy+Math.sin(p.a)*p.v*r+900*r*r;x.save();x.globalAlpha=cl(1.6-r);x.translate(X,Y);x.rotate(p.r+r*8);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}}
function caption(str,t0,t,dur=3){if(t<t0||t>t0+dur)return;const a=Math.min(cl((t-t0)*6),cl((t0+dur-t)*4));x.globalAlpha=a;const size=fit(str,1500,50);x.font=`800 ${size}px ${F}`;const w=x.measureText(str).width+80;rr(W/2-w/2,960,w,90,45);x.fillStyle='rgba(0,0,0,.45)';x.fill();text(str,W/2,1006,size,'#fff',800);x.globalAlpha=1}
const RCAP=['Round one · Easy','Round two · Medium','Final round · Hard'],RSUB=['Warm up!','A little trickier…','Only real foodies get these'];
function frame(t){
  let cur=-1;for(const g of RSEG)if(t>=g.s)cur=g.ri;
  let shake=0;for(const g of SEG){const r=t-g.rv;if(r>=0&&r<.22)shake=12*(1-r/.22)*Math.sin(r*90)}
  x.save();x.translate(shake,0);bg(t,cur);
  if(t<INTRO){stroked('GUESS 20 FOODS',W/2,330,140,'#fff');stroked('BY EMOJI',W/2-60,500,140,'#ffc93c');text('🍔',W/2+400,495,140,'#000',400,E);
    ["🍔", "🥞", "🍰", "🧀", "🥚", "🍟", "🌭"].forEach((e,i)=>{const p=pop((t-.2-i*.1)*3);if(p<=0)return;x.save();x.translate(W/2+(i-3)*190,720+Math.sin(t*4+i)*14);x.scale(p,p);text(e,0,0,120,'#000',400,E);x.restore()});
    pillAt('EASY → MEDIUM → HARD',W/2,890,'#ffc93c','#1b1b3a',46);caption('Keep score!',.3,t,INTRO-.3);x.restore();return}
  if(t<ENDT){
    const rs=RSEG.find(g=>t>=g.s&&t<g.e);
    if(rs){const k=t-rs.s;const p=pop(k*2.5);x.save();x.translate(W/2,430);x.scale(p,p);stroked(`ROUND ${rs.ri+1}`,0,0,150,'#fff');x.restore();
      x.globalAlpha=ease((k-.2)*3);pillAt(ROUNDS[rs.ri].name,W/2,620,'#ffc93c','#1b1b3a',80,70);text(RSUB[rs.ri],W/2,780,56,'#dbe6ff',700);x.globalAlpha=1;caption(RCAP[rs.ri],rs.s,t,Math.min(3.2,rs.e-rs.s));x.restore();return}
    const g=SEG.find(g=>t>=g.s&&t<g.e)||SEG[0],it=ALL[g.i],k=t-g.s;
    pillAt(`ROUND ${it.round+1} · ${ROUNDS[it.round].name}`,W/2,70,'#ffc93c','#1b1b3a',36);text(`${g.i+1} / ${ALL.length}`,W-70,70,46,'#fff',800,F,'right');
    stroked('GUESS THE FOOD',760,190,64,'#fff');
    x.save();x.translate(760,500);const cs=pop(k*3);x.scale(cs,cs);x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=50;x.shadowOffsetY=16;rr(-560,-220,1120,440,52);x.fillStyle='#fff';x.fill();x.shadowColor='transparent';x.restore();
    emojis(it.q,760,505,200,300,k*1);
    if(t<g.rv)ring(t<g.cd?COUNT:g.rv-t);
    else{const r=t-g.rv;confetti(r,760,500);const sc=pop(r*3.5);x.save();x.translate(760,860);x.scale(sc,sc);const size=fit(it.a,1050,76);x.font=`900 ${size}px ${F}`;const w=Math.min(1160,x.measureText(it.a).width+140);rr(-w/2,-80,w,160,80);x.fillStyle='#22c55e';x.fill();text(it.a,0,5,size,'#fff',900);x.restore();x.globalAlpha=cl((r-.35)*4);text(it.w,760,985,44,'#fff',800);x.globalAlpha=1;
      x.save();x.translate(1600,500);const p=pop(r*3);x.scale(p,p);x.beginPath();x.arc(0,0,125,0,Math.PI*2);x.fillStyle='#22c55e';x.fill();text('✓',0,8,140,'#fff',900);x.restore()}
    x.restore();return}
  const u=t-ENDT,endLen=D.end+.8;
  if(u<endLen){stroked('HOW MANY DID YOU GET?',W/2,220,104,'#fff');
    [["0–7", "SNACK ROOKIE", "🍪", "#ff6b4a"], ["8–14", "FOOD FAN", "🍕", "#ffb020"], ["15–19", "TOP CHEF", "🏆", "#22c55e"], ["20", "FOOD GENIUS", "🧠", "#a855f7"]].forEach(([n,l,e,c],i)=>{const p=pop((u-.3-i*.2)*2.5);if(p<=0)return;x.save();x.translate(W/2+(i-1.5)*430,560);x.scale(p,p);rr(-195,-170,390,340,36);x.fillStyle=c;x.fill();text(e,0,-80,90,'#000',400,E);text(n,0,30,70,'#fff',900);text(l,0,105,38,'#fff',800);x.restore()});
    text('Comment your score',W/2-40,850,58,'#fff',800);text('👇',W/2+340,850,62,'#000',400,E);const s=1+Math.sin(u*7)*.04;x.save();x.translate(W/2,975);x.scale(s,s);pillAt('SUBSCRIBE',0,0,'#ff3b3b','#fff',64,70);x.restore();x.restore();return}
  const v=u-endLen;x.globalAlpha=ease(v*3);stroked('WANT MORE?',W/2,250,100,'#ffc93c');stroked('1,200+ FREE PUZZLES',W/2,400,120,'#fff');text('daily challenge · play with friends · no app needed',W/2,520,52,'#dbe6ff',600);
  const p=pop(v*2);x.save();x.translate(W/2,720);x.scale(p,p);rr(-560,-120,1120,240,48);x.fillStyle='#fff';x.fill();text('🧠',-450,4,130,'#000',400,E);text('brainteasersclub.app',70,8,fit('brainteasersclub.app',820,86),'#1b1b3a',900);x.restore();
  text('link in the description',W/2,920,48,'#dbe6ff',600);x.globalAlpha=1;x.restore();
}
// thumbnail 1280x720
function thumb(){const c=document.createElement('canvas');c.width=1280;c.height=720;const X=c.getContext('2d');X.scale(1280/W,720/H);const old=x;x=X;
  bg(2.3,0);stroked('GUESS 20',520,250,190,'#fff');stroked('FOODS',520,450,190,'#ffc93c');pillAt('BY EMOJI · EASY → HARD',520,640,'#ffc93c','#1b1b3a',58);
  x.save();x.translate(1440,560);x.rotate(-.05);x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=60;rr(-360,-300,720,600,60);x.fillStyle='#fff';x.fill();x.shadowColor='transparent';x.restore();
  text('🏄🌱',1440,430,180,'#000',400,E);text('❓',1440,690,150,'#000',400,E);x=old;return c}
// ---------- sound ----------
let ac,dest,OFF=false;const BUF={};const OUT=g=>{g.connect(dest);if(!OFF)g.connect(ac.destination)};
function tone(f,at,d,type='sine',v=.25,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);OUT(g);o.start(at);o.stop(at+d+.05)}
function noise(at,d,v,f){const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.setValueAtTime(f,at);bp.frequency.exponentialRampToValueAtTime(f*4,at+d);g.gain.value=v;s.connect(bp);bp.connect(g);OUT(g);s.start(at)}
function say(n,at){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=BUF[n];g.gain.value=1.2;s.connect(g);OUT(g);s.start(at)}
function schedule(t0){
  const beat=60/112;for(let b=0;b*beat<TOTAL-.4;b++){const at=t0+b*beat;tone(b%2?98:62,at,.2,'sine',.1,40);if(b%2)noise(at,.05,.04,6000)}
  const arp=[523,659,784,988,784,659];for(let b=0;b*beat/2<TOTAL-.4;b++)tone(arp[b%6]/2,t0+b*beat/2,.18,'triangle',.016);
  noise(t0,.5,.25,400);say('intro',t0+.2);
  RSEG.forEach(g=>{noise(t0+g.s,.6,.25,300);[392,523,659].forEach((f,i)=>tone(f,t0+g.s+i*.1,.25,'square',.06));say('r'+(g.ri+1),t0+g.s+.35)});
  SEG.forEach(g=>{const at=t0+g.s;noise(at,.3,.15,500);const n=[...new Intl.Segmenter().segment(ALL[g.i].q)].length;for(let j=0;j<n;j++)tone(500+j*150,at+.15+j*.18,.08,'triangle',.07,900);
    for(let k=0;k<COUNT;k++)tone(k===COUNT-1?1200:950,t0+g.cd+k,.07,'square',k===COUNT-1?.075:.05);
    tone(988,t0+g.rv,.12,'square',.08);tone(1319,t0+g.rv+.08,.32,'square',.08);noise(t0+g.rv,.35,.1,2000);say('a'+(g.i+1),t0+g.rv+.22)});
  const e=t0+ENDT;[392,523,659,784,1047].forEach((f,i)=>tone(f,e+i*.09,.3,'square',.05));say('end',e+.2);say('plug',e+D.end+.8+.2);
}
async function exportMp4(name){
  await document.fonts.load('900 80px Poppins');await document.fonts.load('100px "Noto Color Emoji"',ALL.map(a=>a.q).join('')+"🍔🧠👇🏆❓🍔🥞🍰🧀🥚🍟🌭🍪🍕🏆🧠");
  const FPS=30,SR=48000,N=Math.ceil(TOTAL*FPS);OFF=true;ac=new OfflineAudioContext(2,Math.ceil((TOTAL+.2)*SR),SR);dest=ac.destination;
  for(const n of Object.keys(D))BUF[n]=await ac.decodeAudioData(await (await fetch(VOICE+n+'.wav')).arrayBuffer());
  schedule(0);const audio=await ac.startRendering();let pk=0;for(let c=0;c<2;c++){const d=audio.getChannelData(c);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]))}
  const gain=pk>.95?.95/pk:1;if(gain!==1)for(let c=0;c<2;c++){const d=audio.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=gain}
  const {Muxer,ArrayBufferTarget}=Mp4Muxer;const target=new ArrayBufferTarget();
  const mux=new Muxer({target,fastStart:'in-memory',video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:{codec:'aac',numberOfChannels:2,sampleRate:SR}});
  const ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{throw e}});ve.configure({codec:'avc1.640028',width:W,height:H,bitrate:8e6,framerate:FPS,latencyMode:'quality'});
  window.__prog=0;for(let f=0;f<N;f++){frame(f/FPS);const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(vf,{keyFrame:f%60===0});vf.close();window.__prog=f/N;
    if(ve.encodeQueueSize>20)await new Promise(r=>ve.addEventListener('dequeue',r,{once:true})) /* not throttled when the page is hidden */}
  await ve.flush();const ae=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>{throw e}});ae.configure({codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:192000});
  const L=audio.getChannelData(0),R=audio.getChannelData(1),STEP=1024*20,total=Math.min(L.length,Math.round(N/FPS*SR));
  for(let i=0;i<total;i+=STEP){const n=Math.min(STEP,total-i),pl=new Float32Array(n*2);pl.set(L.subarray(i,i+n),0);pl.set(R.subarray(i,i+n),n);const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i*1e6/SR),data:pl});ae.encode(ad);ad.close()}
  await ae.flush();mux.finalize();const blob=new Blob([target.buffer],{type:'video/mp4'});const r=await fetch('/out/'+name,{method:'PUT',body:blob});
  const tb=await new Promise(res=>thumb().toBlob(res,'image/png'));await fetch('/out/'+name.replace('.mp4','_thumbnail.png'),{method:'PUT',body:tb});
  return {status:r.status,mb:(blob.size/1e6).toFixed(1),secs:(N/FPS).toFixed(1),peak:pk.toFixed(2)};
}
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
window.chapters=()=>['0:00 Intro',...RSEG.map((g,i)=>mmss(g.s)+' Round '+(i+1)+': '+ROUNDS[i].name[0]+ROUNDS[i].name.slice(1).toLowerCase()),mmss(ENDT)+' Your score'].join('\n');
window.preview=t=>{frame(t);return TOTAL};window.exportMp4=exportMp4;window.showThumb=()=>{const c=thumb();x.drawImage(c,0,0,W,H)};
fetch(VOICE+'durations.json').then(r=>r.json()).then(d=>{D=d;plan()}).then(()=>document.fonts.load('900 80px Poppins')).then(()=>document.fonts.load('100px "Noto Color Emoji"','🦁🎬')).then(()=>frame(0));
</script></body></html>
